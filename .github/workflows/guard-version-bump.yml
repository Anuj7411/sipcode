name: Guard against accidental minor/major bumps

# Sipcode follows patch-by-default (memory: feedback_versioning.md). A minor
# or major bump should be deliberate and discussed; CI fails if a bump like
# that lands on `main` without an explicit "[minor-ok]" or "[major-ok]"
# marker in a commit subject line. This catches the v1.7.0 slip class of
# mistakes.
#
# The marker may be in ANY commit subject of the push (e.g. the release
# commit inside a merged PR). Checking only the newest subject could never
# pass a PR merge, whose subject is always "Merge pull request #N".

on:
  push:
    branches: [main]
    paths:
      - "package.json"
  workflow_dispatch:

jobs:
  check-version-bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare current vs previous package.json version
        id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -e
          # Compare against the commit main was at before this push. Manual
          # runs (and a first push) have no usable "before": use HEAD~1.
          if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            BEFORE=$(git rev-parse HEAD~1)
          fi
          echo "range: $BEFORE..HEAD"
          # If package.json didn't actually change in this push, exit clean.
          if ! git diff --name-only "$BEFORE" HEAD | grep -q '^package\.json$'; then
            echo "no package.json change"
            exit 0
          fi
          prev=$(git show "$BEFORE":package.json | python3 -c "import sys,json;print(json.load(sys.stdin)['version'])")
          curr=$(python3 -c "import json;print(json.load(open('package.json'))['version'])")
          echo "prev=$prev curr=$curr"
          # If unchanged, fine.
          if [ "$prev" = "$curr" ]; then exit 0; fi
          prev_minor=$(echo "$prev" | cut -d. -f2)
          prev_major=$(echo "$prev" | cut -d. -f1)
          curr_minor=$(echo "$curr" | cut -d. -f2)
          curr_major=$(echo "$curr" | cut -d. -f1)
          commit_msg=$(git log --format=%s "$BEFORE"..HEAD)
          echo "commit subjects in this push:"
          echo "$commit_msg"
          if [ "$curr_major" -gt "$prev_major" ]; then
            if echo "$commit_msg" | grep -q '\[major-ok\]'; then
              echo "major bump explicitly authorized"
              exit 0
            fi
            echo "::error::Major version bump $prev -> $curr without [major-ok] marker in commit subject."
            echo "::error::Sipcode policy: patch-by-default. If this bump is intentional, include [major-ok] in a commit subject of the push (e.g. the release commit)."
            exit 1
          fi
          if [ "$curr_minor" -gt "$prev_minor" ]; then
            if echo "$commit_msg" | grep -q '\[minor-ok\]'; then
              echo "minor bump explicitly authorized"
              exit 0
            fi
            echo "::error::Minor version bump $prev -> $curr without [minor-ok] marker in commit subject."
            echo "::error::Sipcode policy: patch-by-default (see feedback_versioning.md). If this bump is intentional, include [minor-ok] in a commit subject of the push (e.g. the release commit)."
            exit 1
          fi
          echo "patch bump $prev -> $curr, ok"
