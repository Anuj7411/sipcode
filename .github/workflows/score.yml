name: sipcode score

on:
  pull_request:
  push:
    branches: [main]

jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: install
        run: npm ci

      - name: build (so the local cli is runnable)
        run: npm run build || true

      - name: run sipcode score
        # Threshold 70 leaves comfortable headroom; we run at ~91 with the
        # current .sipcodeignore. Bump back to 80 once docs density (SC032)
        # pushes us into the high 90s.
        run: npx tsx src/cli.ts score --threshold 70 --badge --no-html

      - name: upload badge artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sipcode-badge
          path: .sipcode/badge.json
          if-no-files-found: warn
